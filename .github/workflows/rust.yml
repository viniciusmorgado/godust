name: Release to crates.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features

      - name: Get next version
        id: semver
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Update Cargo.toml version
        run: |
          TARGET_VERSION="${{ steps.semver.outputs.version }}"
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "Cargo.toml is already at version $TARGET_VERSION (bumped by a prior attempt); skipping bump commit."
          else
            sed -i 's/^version = ".*"/version = "'"$TARGET_VERSION"'"/' Cargo.toml
            cargo update -p godust
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore: bump version to $TARGET_VERSION"
            git push
          fi

      - name: Publish to crates.io
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "godust-release-workflow (+https://github.com/viniciusmorgado/godust)" "https://crates.io/api/v1/crates/godust/$VERSION")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "godust $VERSION is already published on crates.io; skipping publish."
          else
            cargo publish --token ${{ secrets.CARGO_TOKEN }}
          fi

      - name: Create Git Tag
        run: |
          TAG="v${{ steps.semver.outputs.version }}"
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$EXISTING_TAG" ]; then
            echo "Tag $TAG already exists on origin; skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
